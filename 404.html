<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f2e9">
  <title>A little detour | Sasindu &amp; Piyumi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23f6f2e9'/%3E%3Cpath d='M8 24V14a8 8 0 0116 0v10Z' fill='none' stroke='%23a68d5e'/%3E%3C/svg%3E">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:32px 20px;background:radial-gradient(ellipse at 25% 20%,#fffdf6,transparent 65%),linear-gradient(120deg,#eee6d8,#f6f2e9 50%,#e9dfce);color:#665437;font-family:Georgia,'Times New Roman',serif;text-align:center}
    main{position:relative;width:min(100%,480px);padding:80px 30px 48px;border:1px solid #ab946b80;border-radius:250px 250px 10px 10px;background:linear-gradient(140deg,#fffdf5e6,#f3ecddd9);outline:1px solid #ab946b40;outline-offset:-12px;animation:glow 6s ease-in-out infinite}
    .names{font-size:clamp(27px,7vw,36px);font-style:italic;margin:0 0 38px;font-weight:400}
    .names span{font-size:.7em;padding:0 .15em}
    .eyebrow{font:11px/1.7 Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;margin:0 0 16px}
    h1{font-size:clamp(34px,8vw,46px);font-weight:400;font-style:italic;line-height:1.15;margin:0 0 22px}
    .message{max-width:29ch;margin:0 auto;font-size:17px;line-height:1.7;color:#79674d}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:30px;padding:12px 20px;border:1px solid #ac946b;border-radius:30px;color:#665437;text-decoration:none;font:14px/1.5 Arial,sans-serif;transition:background .2s,box-shadow .2s}
    a:hover{background:#e8dcc6;box-shadow:0 4px 16px #a68d5e25}
    a:focus-visible{outline:2px solid #94743e;outline-offset:5px}
    .date{font:10px/1.7 Arial,sans-serif;letter-spacing:.18em;margin:32px 0 0}
    @keyframes glow{0%,100%{box-shadow:0 20px 70px #66543712,0 0 6px #d8bd8620}50%{box-shadow:0 20px 70px #66543718,0 0 28px #d8bd8655}}
    @media(prefers-reduced-motion:reduce){main{animation:none}a{transition:none}}
    @media(max-height:650px){main{padding-top:48px;padding-bottom:32px}.names{margin-bottom:24px}}
  </style>
</head>
<body>
  <main>
    <p class="names">Sasindu <span>&amp;</span> Piyumi</p>
    <p class="eyebrow">404 · Page not found</p>
    <h1>A little detour.</h1>
    <p class="message">This page isn't here, but a beautiful celebration awaits you.</p>
    <a id="invitation-link" href="/">Return to the invitation &nbsp;↗</a>
    <p class="date">21 OCTOBER 2026 · WITH LOVE, FOR YOU</p>
  </main>
  <script>
    (() => {
      // Set to '/folder/' if hosting below a path on a custom domain.
      const customBase = '/';
      let home = customBase;
      if (location.protocol === 'file:') home = './index.html';
      else if (location.hostname.endsWith('.github.io')) {
        // Project sites live under /repository/; preserve it even on deep missing URLs.
        const project = location.pathname.split('/').filter(Boolean)[0];
        if (project && project !== '404.html') home = '/' + project + '/';
      }
      document.getElementById('invitation-link').setAttribute('href', home);
    })();
  </script>
</body>
</html>
